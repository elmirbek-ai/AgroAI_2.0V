name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: python -m pip install "python-dotenv>=1,<2"

      - name: Compile Python source
        run: |
          python -m compileall -q api db migrations config.py main.py tests

      - name: Run security configuration regression tests
        run: python -m unittest discover -s tests -v
